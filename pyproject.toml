[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-triage"
version = "0.1.0"
description = "Support-engineer toolkit: diagnose failing integration API calls from request logs, then draft the customer reply, engineering escalation and runbook."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "mcp>=2.0"]

[project.scripts]
triage = "integration_triage.cli:main"
triage-mcp = "integration_triage.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
integration_triage = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
